name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci                # also builds the renderer package from its git tag (its "prepare" script)
      - run: npm test              # the game rules, in Node
      - run: npm run build         # typecheck, then the game
