<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>Soil n Silo — The Living Valley</title>
  <style>
    /* The page: the valley's canvas fills the window and the UI (src/ui/style.css) floats over it. No web fonts: the
       stacks fall back to what the system has, so it reads the same offline. */
    html, body {
      margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: #e9e4d6; color: #1f2721;
      font: 500 14px/1.35 Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", source-sans-pro, system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="The valley"></canvas>
  <div id="ui"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
